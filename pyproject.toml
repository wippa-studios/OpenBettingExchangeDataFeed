[project]
name = "betfeed"
version = "1.0.0"
description = "Two-tier Betfair Exchange feed (fixtures / fixtures+odds) on Postgres, exposed over MCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "betfairlightweight>=2.24.0",
    # betfeed/mcp_server.py imports `mcp.server.fastmcp` — the official SDK's
    # BUNDLED fastmcp, not the third-party `fastmcp` package. fastmcp happened
    # to depend on mcp, so this worked by transitivity while the declared floor
    # constrained nothing that was actually imported, and an automated "remove
    # unused packages" pass would have deleted fastmcp and killed `betfeed-mcp`
    # with ModuleNotFoundError. Declared at the version actually in use.
    "mcp>=1.9.4",
    "psycopg[binary]>=3.2",
]

[project.scripts]
betfeed = "betfeed.cli:main"
betfeed-mcp = "betfeed.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["betfeed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 110
target-version = "py313"