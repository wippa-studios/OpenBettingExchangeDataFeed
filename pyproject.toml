[project]
name = "betfeed"
version = "1.0.0"
description = "Two-tier Betfair Exchange feed (fixtures / fixtures+odds) on Postgres, exposed over MCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "betfairlightweight>=2.24.0",
    "fastmcp>=2.9.2",
    "psycopg[binary]>=3.2",
]

[project.scripts]
betfeed = "betfeed.cli:main"
betfeed-mcp = "betfeed.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["betfeed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 110
target-version = "py313"